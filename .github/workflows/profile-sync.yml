name: Sync Portfolio Assets

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'data/profile.json'
      - 'scripts/**'
      - '.github/workflows/profile-sync.yml'

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Adaptive SVG Portfolio Assets
        run: node scripts/generate-assets.mjs

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "chore(portfolio): update adaptive bento svg assets [skip ci]"
            git push
          fi
